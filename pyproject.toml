[project]
name = "pipeline-proxy"
version = "0.1.0"
description = "Pipeline de dados (Alpha Vantage) para demonstrar o design pattern Proxy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_proxy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
